<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ainius Pretkelaitis - Asmeninė Svetainė</title>
  <link rel="stylesheet" href="jerimy-inspired-styles.css" />
  <link rel="icon" href="favicon-dark.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="cursor"></div>

  <nav class="main-nav">
    <a href="index.html">Ainius Pretkelaitis</a>
    <div>
      <a href="psychology/psychology.html">Psichologija</a>
      <a href="tech/tech.html">Technologijos</a>
    </div>
  </nav>

  <main>
    <section class="hero-main">
      <h1>Kūrybiškumas ir Technologijos</h1>
    </section>

    <section class="horizontal-scroll-section">
      <div class="horizontal-scroll-wrapper">
        <div class="portfolio-item reveal">
          <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          <h3>Technologijų Projektai</h3>
        </div>
        <div class="portfolio-item reveal">
          <img src="https://images.unsplash.com/photo-1550537685-9b2a7c6f0b6e?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          <h3>Psichologijos Įžvalgos</h3>
        </div>
        <div class="portfolio-item reveal">
          <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          <h3>Portfolio 3</h3>
        </div>
      </div>
    </section>
  </main>

  <script>
    const cursor = document.querySelector('.cursor');
    document.addEventListener('mousemove', e => {
      cursor.setAttribute("style", "top: "+(e.pageY - 10)+"px; left: "+(e.pageX - 10)+"px;")
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseover', () => {
        cursor.classList.add('cursor-grow');
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('cursor-grow');
      });
    });

    const revealElements = document.querySelectorAll(".reveal");
    const revealOnScroll = () => {
      for (let i = 0; i < revealElements.length; i++) {
        const windowHeight = window.innerHeight;
        const elementTop = revealElements[i].getBoundingClientRect().top;
        const elementVisible = 150;
        if (elementTop < windowHeight - elementVisible) {
          revealElements[i].classList.add("active");
        } else {
          revealElements[i].classList.remove("active");
        }
      }
    };

    window.addEventListener("scroll", revealOnScroll);
    revealOnScroll(); // Initial check
  </script>
</body>
</html>

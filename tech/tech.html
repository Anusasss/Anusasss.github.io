<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technologijų Skiltis</title>
  <link rel="stylesheet" href="../jerimy-brown-dark-styles.css" />
  <link rel="icon" href="../favicon-dark.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="cursor"></div>

  <nav class="main-nav">
    <a href="../index.html">Ainius Pretkelaitis</a>
    <div>
      <a href="../psychology/psychology.html">Psichologija</a>
      <a href="tech.html">Technologijos</a>
    </div>
  </nav>

  <main class="content">
    <h1 class="reveal">Technologijų Pasaulis</h1>
    <div class="card reveal">
      <h2><a href="web-development-basics.html">Web Programavimo Pagrindai</a></h2>
      <p>HTML, CSS ir JavaScript pagrindai, reikalingi kuriant internetines svetaines.</p>
    </div>
    <div class="card reveal">
      <h2><a href="data-structures.html">Duomenų Struktūros</a></h2>
      <p>Pagrindinės duomenų struktūros, naudojamos programavime.</p>
    </div>
  </main>

  <script>
    const cursor = document.querySelector('.cursor');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;

    function animateCursor() {
      cursorX += (mouseX - cursorX) * 0.1; // Easing effect
      cursorY += (mouseY - cursorY) * 0.1; // Easing effect
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      requestAnimationFrame(animateCursor);
    }

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseover', () => {
        cursor.classList.add('cursor-grow');
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('cursor-grow');
      });
    });

    const revealElements = document.querySelectorAll(".reveal");
    const revealOnScroll = () => {
      for (let i = 0; i < revealElements.length; i++) {
        const windowHeight = window.innerHeight;
        const elementTop = revealElements[i].getBoundingClientRect().top;
        const elementVisible = 150;
        if (elementTop < windowHeight - elementVisible) {
          revealElements[i].classList.add("active");
        } else {
          revealElements[i].classList.remove("active");
        }
      }
    };

    window.addEventListener("scroll", revealOnScroll);
    revealOnScroll(); // Initial check
    animateCursor(); // Start cursor animation
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo lentelės</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <nav>
    <div class="logo">🧠 Refleksijos</div>

      <button onclick="location.href='lenteles.html'">Lentelės</button>
      <button onclick="location.href='lenteles copy.html'" class="active">Basic</button>
